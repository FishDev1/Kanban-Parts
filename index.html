<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanban Parts System</title>
<style>
:root{--bg:#f3f4f6;--ink:#111827;--mute:#6b7280;--line:#e5e7eb;--card:#fff;--acc:#2563eb;--dark:#1f2937;
--pink:#f6a9c4;--yellow:#f5e060;--orange:#f4a259;--blue:#86bff0;--green:#8dd29b;--red:#e0554a;--unset:#c8ccd0}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:1px solid #cbd5e1;background:#fff;border-radius:6px;padding:6px 12px}
button:hover{background:#f1f5f9}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}button.pri:hover{background:#1d4ed8}
button.dng{color:#b91c1c;border-color:#fca5a5}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;max-width:100%}
header{background:var(--dark);color:#fff;display:flex;align-items:center;gap:16px;padding:8px 16px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{background:transparent;color:#d1d5db;border:0;border-radius:6px}
nav button.on{background:#374151;color:#fff}
nav .badge{background:var(--acc);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-left:4px}
header .r{display:flex;gap:8px;align-items:center}
header .r button{background:#374151;color:#fff;border-color:#4b5563}
.pill{font-size:12px;padding:3px 10px;border-radius:12px;background:#4b5563}
.pill.ok{background:#166534}.pill.bad{background:#991b1b}.pill.warn{background:#92400e}
main{padding:16px;max-width:1500px;margin:0 auto}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input[type=search]{flex:1;min-width:220px;font-size:16px;padding:9px 12px}
.muted{color:var(--mute)}
.sel-bar{background:#dbeafe;border:1px solid #93c5fd;border-radius:8px;padding:8px 12px;margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.grid.list{grid-template-columns:1fr}
.pc{background:var(--card);border:1px solid var(--line);border-left:7px solid var(--unset);border-radius:10px;overflow:hidden;cursor:pointer;position:relative;display:flex;flex-direction:column}
.pc:hover{box-shadow:0 2px 10px rgba(0,0,0,.15)}
.pc.tag{opacity:.55}
.pc .ph{height:140px;background:#eef0f3;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:12px}
.pc .ph img{width:100%;height:100%;object-fit:contain;background:#fff}
.pc .bd{padding:8px 10px}
.pc .dw{font-size:18px;font-weight:700}
.pc .dw small{font-size:12px;font-weight:600;color:#b45309;margin-left:4px}
.pc .ds{color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .mt{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap;font-size:12px}
.pc .ck{position:absolute;top:6px;left:6px;width:20px;height:20px;z-index:2}
.grid.list .pc{flex-direction:row;align-items:center}
.grid.list .pc .ph{height:60px;width:90px;flex:none}
.grid.list .pc .bd{flex:1;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#e5e7eb;color:#374151;white-space:nowrap}
.st-Triage{background:#e5e7eb}.st-Needs{background:#fde68a;color:#78350f}.st-Ready{background:#bfdbfe;color:#1e3a8a}
.st-Printed{background:#e9d5ff;color:#581c87}.st-InRack{background:#bbf7d0;color:#14532d}.st-Not{background:#f3f4f6;color:#6b7280}.st-New{background:#fed7aa;color:#7c2d12}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.3);vertical-align:-1px}
.c-Pink{--c:var(--pink)}.c-Yellow{--c:var(--yellow)}.c-Orange{--c:var(--orange)}.c-Blue{--c:var(--blue)}.c-Green{--c:var(--green)}.c-Red{--c:var(--red)}.c-Unset{--c:var(--unset)}
.pc[class*=c-]{border-left-color:var(--c)}.dot[class*=c-]{background:var(--c)}
.board{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding-bottom:12px}
.col{background:#e5e7eb;border-radius:10px;min-width:250px;width:250px;flex:none;padding:8px;max-height:calc(100vh - 190px);overflow-y:auto}
.col h3{margin:2px 4px 8px;font-size:13px;display:flex;justify-content:space-between}
.col.over{outline:3px dashed var(--acc)}
.bc{background:#fff;border-left:6px solid var(--unset);border-radius:6px;padding:6px 8px;margin-bottom:6px;cursor:grab;font-size:13px}
.bc[class*=c-]{border-left-color:var(--c)}
.bc b{font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer}
.tile .n{font-size:30px;font-weight:700}
.tile:hover{box-shadow:0 2px 10px rgba(0,0,0,.15)}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.panel h2{margin:0 0 10px;font-size:16px}
table.t{border-collapse:collapse;width:100%}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:middle}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.25);transform:translateX(105%);transition:transform .18s;z-index:40;display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer .dh{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
#drawer .db{padding:12px 16px;overflow-y:auto;flex:1}
#drawer .big{width:100%;max-height:260px;object-fit:contain;background:#f3f4f6;border-radius:8px;margin-bottom:10px}
.fg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 12px;margin-bottom:6px}
.fg label{display:flex;flex-direction:column;font-size:12px;color:var(--mute)}
.fg label.w{grid-column:1/-1}
.fg input,.fg select,.fg textarea{color:var(--ink);font-size:14px}
.fg input:disabled,.fg select:disabled,.fg textarea:disabled{background:#f9fafb;color:#111827;border-color:#eee}
.ghd{font-weight:700;margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:#374151}
.rel a,.dw a{display:inline-block;margin:2px 6px 2px 0;color:var(--acc);cursor:pointer;text-decoration:underline}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 16px;border-radius:8px;z-index:100;display:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.mdl{background:#fff;border-radius:12px;padding:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.mdl h3{margin:0 0 10px}.mdl .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.welcome{max-width:640px;margin:60px auto;text-align:center}
.welcome button{font-size:16px;padding:12px 22px}
textarea.lst{width:100%;height:150px}
#printRoot{display:none}
.sheet{width:8.5in;height:10.97in;overflow:hidden;display:grid;grid-template-columns:4.25in 4.25in;grid-template-rows:1fr 1fr;page-break-after:always;break-after:page;background:#fff}
.cardp{margin:.18in;border:3px solid #000;padding:.1in .14in;display:flex;flex-direction:column;overflow:hidden;font-family:Arial,sans-serif;color:#000;font-size:11pt}
.cardp.red{border-color:#d00}
.cardp .h{display:flex;justify-content:space-between;font-weight:700;font-size:13pt;border-bottom:2px solid #000;padding-bottom:2px}
.cardp .dwg{font-size:24pt;font-weight:800;line-height:1.1;margin-top:3px}
.cardp .desc{font-size:12pt;margin-bottom:3px;max-height:2.6em;overflow:hidden}
.cardp table{width:100%;border-collapse:collapse;font-size:10pt;margin:2px 0}
.cardp td,.cardp th{border:1px solid #000;padding:1px 4px;height:.2in;text-align:left}
.cardp th{background:#eee}
.cardp .trig{display:flex;justify-content:space-between;font-weight:700;font-size:12pt;margin-top:3px}
.cardp.red .trig .tv{color:#d00;font-size:15pt}
.cardp .ft{display:flex;justify-content:space-between;font-size:9pt;margin-top:2px}
.cardp .pho{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:3px 0}
.cardp .pho img{max-width:100%;max-height:100%;object-fit:contain}
.cardp .mt{font-size:9pt;font-weight:700}
@media print{
 @page{size:letter portrait;margin:0}
 body.printing>*:not(#printRoot){display:none!important}
 body.printing #printRoot{display:block}
 body.printing{background:#fff}
}
</style>
</head>
<body>
<header>
 <h1>Kanban Parts System</h1>
 <nav id="tabs">
  <button data-v="parts">Parts</button>
  <button data-v="board">Board</button>
  <button data-v="queue">Print queue<span class="badge" id="qn">0</span></button>
  <button data-v="todo">To Do</button>
  <button data-v="admin" id="tabAdmin" style="display:none">Admin</button>
 </nav>
 <div class="r">
  <span class="pill" id="sync">Not connected</span>
  <button id="btnFolders">Folders</button>
  <button id="btnUser">Name</button>
  <button id="btnHelp">?</button>
 </div>
</header>
<main id="main"></main>
<aside id="drawer"></aside>
<div id="printRoot"></div>
<div id="toast"></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const nowStr=()=>{const d=new Date();return today()+' '+pad(d.getHours())+':'+pad(d.getMinutes());};
const COLORS=['Pink','Yellow','Orange','Blue','Green','Red'];
let toastT;function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',ms);}

/* ---------- state ---------- */
const S={data:null,dir:null,imgDir:null,photoDir:null,dwgDir:null,dataFH:null,lastMod:0,
 user:localStorage.getItem('kb_user')||'',view:'parts',q:'',f:{status:'',color:'',rack:'',route:'',flag:''},
 shown:120,sel:new Set(),queue:new Set(JSON.parse(localStorage.getItem('kb_queue')||'[]')),
 list:false,needReconnect:[],byId:new Map(),keys:new Map(),editing:null,edit:null,boardShown:{}};
const saveQueue=()=>{localStorage.setItem('kb_queue',JSON.stringify([...S.queue]));$('#qn').textContent=S.queue.size;};

/* ---------- field model ---------- */
const GROUPS=[
['Identity',[['Drawing','t'],['Variant / Finish','combo:@variants'],['Description','t'],['Secondary Description','t'],['Rack Location','combo:@racks'],['Card Status','sel:Card Status'],['Card Type','sel:Card Type'],['Contact','combo:Contact']]],
['Reorder',[['Reorder Qty','n'],['Reorder Point','n'],['Red Reorder Point','n'],['2-Bin Reorder Point','n'],['Weekly Avg Demand','n'],['Parts Per Sheet','n'],['Preferred Qty Per Run','n'],['Volume Type','sel:Volume Type'],['2-Bin Candidate','yn'],['Kanban Needed (original)','yn']]],
['Material & size',[['Material','combo:@materials'],['Thickness (in)','thick'],['Length (in)','n'],['Width (in)','n'],['Height (in)','n'],['Size / Dimensions','t'],['Material Profile','combo:Material Profile'],['Cosmetic','combo:Cosmetic'],['Bends','n'],['Benn PN','t'],['MC#','t'],['Bin Size Code','t']]],
['Process',[['Process Route','t'],['Keep On','sel:Keep On'],['Migrated To Laser','combo:@migr'],['Kept At Kampco','yn'],['Needs Dash #','yn']]],
['Tracking',[['Card Printed Date','d'],['Card Done/Shipped Date','d'],['Placed In Rack','d'],['Missing Info','t'],['Data Gaps','t'],['Notes','a'],['Comments','a']]],
['System',[['Card ID','ro'],['File Key','t'],['Has Photo','ro'],['Original Entry','ro'],['Delete Tag','ro'],['Last Edited By','ro'],['Last Edited','ro']]]];
const ALLK=GROUPS.flatMap(g=>g[1].map(f=>f[0]));
const REQUIRED=['Drawing','Description','Rack Location','Thickness (in)','Process Route','Reorder Qty','Reorder Point'];
const AUTO_ST=['','Setup - Needs Info','Setup - Ready to Print','New Part - Not Printed'];

/* ---------- derived values ---------- */
const cfg=()=>S.data.config;
function fmtT(v){if(v===undefined||v===null||v==='')return '';if(v==='N/A')return 'N/A';const n=Number(v);if(isNaN(n))return String(v);const s=n.toFixed(3);return n<1?s.replace(/^0/,''):s;}
function paperFor(v){if(v==='N/A')return 'Red';if(v===undefined||v===null||v==='')return 'Unset';const n=Number(v);const e=cfg().paper.find(x=>x.t!=='N/A'&&Math.abs(Number(x.t)-n)<0.0005);return e?e.c:'Unset';}
function stCls(s){s=s||'';if(s.startsWith('Triage'))return 'st-Triage';if(s.includes('Needs Info'))return 'st-Needs';if(s.includes('Ready'))return 'st-Ready';if(s.startsWith('Card Printed'))return 'st-Printed';if(s==='In Rack')return 'st-InRack';if(s.startsWith('Not a'))return 'st-Not';return 'st-New';}
const pkey=p=>[p['Drawing'],p['Variant / Finish'],p['Rack Location']].map(x=>String(x??'').trim().toLowerCase()).join('|');
const title=p=>p['Drawing']+(p['Variant / Finish']?' '+p['Variant / Finish']:'');
const base=d=>String(d||'').split('-')[0];
function fileKey(p){return (p['File Key']||String(p['Drawing']||'').replace(/\(.*?\)/g,'').split('/')[0]).trim();}
function indexAll(){S.byId.clear();S.keys.clear();
 for(const p of S.data.parts){S.byId.set(p.id,p);
  S.keys.set(p.id,[p['Drawing'],p['Variant / Finish'],p['Description'],p['Secondary Description'],p['Benn PN'],p['MC#'],p['Rack Location'],p['Material'],p['Size / Dimensions'],p['Notes'],p['Comments'],p['Process Route'],p['Card Status']].filter(x=>x!==undefined).join(' ').toLowerCase());}
 for(const id of [...S.queue])if(!S.byId.has(id))S.queue.delete(id);
 for(const id of [...S.sel])if(!S.byId.has(id))S.sel.delete(id);
 saveQueue();}
function listFor(name){
 if(name==='@racks')return cfg().racks;
 if(name==='@materials')return cfg().materials;
 if(name==='@variants')return [...new Set(S.data.parts.map(p=>p['Variant / Finish']).filter(Boolean))].sort();
 if(name==='@migr')return [...new Set(S.data.parts.map(p=>p['Migrated To Laser']).filter(Boolean))];
 return cfg().lists[name]||[];}
function isReady(p){return REQUIRED.every(k=>p[k]!==undefined&&p[k]!==''&&p[k]!==null);}

/* ---------- IndexedDB (remember folder permissions) ---------- */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('kanban-parts',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function hGet(k){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('h').objectStore('h').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);});}catch(e){return null;}}
async function hPut(k,v){try{const d=await idb();await new Promise((res,rej)=>{const t=d.transaction('h','readwrite');t.objectStore('h').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}catch(e){}}

/* ---------- connect to folders ---------- */
const KINDS={shared:'Shared data folder (read/write)',photos:'Photos folder (read only, optional)',dwg:'Drawings root (read only, optional)'};
async function perm(h,mode,ask){if(!h)return false;const o={mode};try{if((await h.queryPermission(o))==='granted')return true;if(ask&&(await h.requestPermission(o))==='granted')return true;}catch(e){}return false;}
async function pick(kind){
 if(!window.showDirectoryPicker){await modal('Browser not supported','<p>Open this page in Chrome or Edge.</p>');return;}
 let h;try{h=await showDirectoryPicker({id:'kb-'+kind,mode:kind==='shared'?'readwrite':'read'});}catch(e){return;}
 await hPut(kind,h);await attach(kind,h);}
async function attach(kind,h){
 if(kind==='shared'){S.dir=h;S.imgDir=await h.getDirectoryHandle('images',{create:true});await loadData(true);}
 else if(kind==='photos')S.photoDir=h;else S.dwgDir=h;
 S.dwgIdx=null;PH.clear();render();}
async function autoConnect(){
 S.needReconnect=[];
 for(const k of Object.keys(KINDS)){const h=await hGet(k);if(!h)continue;
  if(await perm(h,k==='shared'?'readwrite':'read',false))await attach(k,h);else S.needReconnect.push([k,h]);}
 setSync();render();}
async function reconnectAll(){
 for(const [k,h] of S.needReconnect){if(await perm(h,k==='shared'?'readwrite':'read',true))await attach(k,h);}
 S.needReconnect=S.needReconnect.filter(([k])=>!S[{shared:'dir',photos:'photoDir',dwg:'dwgDir'}[k]]);setSync();render();}
function setSync(t,cls){const e=$('#sync');
 if(!t){if(S.dir&&S.data){t='Synced · '+S.data.parts.length+' parts';cls='ok';}else if(S.needReconnect.length){t='Reconnect needed';cls='warn';}else{t='Not connected';cls='bad';}}
 e.textContent=t;e.className='pill '+(cls||'');}

/* ---------- data file ---------- */
async function readData(){const f=await S.dataFH.getFile();const d=JSON.parse(await f.text());S.lastMod=f.lastModified;return d;}
async function writeText(dir,name,text){const fh=await dir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(text);await w.close();return fh;}
async function writeData(d){d.meta={updated:new Date().toISOString(),updatedBy:S.user||'?'};
 const w=await S.dataFH.createWritable();await w.write(JSON.stringify(d));await w.close();S.lastMod=(await S.dataFH.getFile()).lastModified;}
async function loadData(first){
 try{S.dataFH=await S.dir.getFileHandle('kanban-data.json');}catch(e){S.dataFH=null;S.data=null;setSync('No data file','warn');return offerImport();}
 S.data=await readData();indexAll();setSync();
 if(first){dailyBackup();if(!localStorage.getItem('kb_guide_seen')){localStorage.setItem('kb_guide_seen','1');setTimeout(showGuide,400);}}}
async function offerImport(){
 const r=await modal('No data file in this folder','<p>This folder has no <b>kanban-data.json</b>. Choose the starter file you were given and it will be copied in.</p><input type="file" id="impf" accept=".json">',[{t:'Cancel',v:false},{t:'Import',v:true,pri:true}]);
 if(!r.v)return;const f=$('#impf',r.root).files[0];if(!f)return toast('No file chosen');
 try{const d=JSON.parse(await f.text());if(!Array.isArray(d.parts))throw 0;
  S.dataFH=await S.dir.getFileHandle('kanban-data.json',{create:true});await writeData(d);S.data=d;indexAll();setSync();toast('Imported '+d.parts.length+' parts');render();}
 catch(e){toast('That file is not a valid kanban-data.json');}}
let chain=Promise.resolve();
function commit(fn){const run=chain.then(async()=>{
  if(!S.dataFH)throw new Error('Not connected');
  const disk=await readData();const res=fn(disk);await writeData(disk);S.data=disk;indexAll();return res;});
 chain=run.catch(()=>{});return run;}
async function poll(){if(!S.dataFH||S.editing)return;try{const f=await S.dataFH.getFile();if(f.lastModified>S.lastMod){S.data=await readData();indexAll();render();toast('Updated: someone saved changes');}}catch(e){setSync('Connection lost','bad');}}
setInterval(poll,15000);
async function dailyBackup(){try{const bd=await S.dir.getDirectoryHandle('Backups',{create:true});const name='kanban-data_'+today()+'.json';
  try{await bd.getFileHandle(name);return;}catch(e){}
  await writeText(bd,name,JSON.stringify(S.data));
  const names=[];for await(const [n] of bd.entries())if(/^kanban-data_.*\.json$/.test(n))names.push(n);names.sort();
  while(names.length>30)await bd.removeEntry(names.shift());}catch(e){}}
async function backupNow(){const bd=await S.dir.getDirectoryHandle('Manual Backups',{create:true});const n='kanban-data_'+today()+'_'+pad(new Date().getHours())+pad(new Date().getMinutes())+'.json';await writeText(bd,n,JSON.stringify(S.data));toast('Backup saved: Manual Backups/'+n);}

/* ---------- guided folder setup ---------- */
const KMAP={shared:'dir',photos:'photoDir',dwg:'dwgDir'};
const KNAME={shared:['1','Kanban System folder','Holds kanban-data.json. Required.','sharedPath','sharedUnc'],photos:['2','Photos folder','Part photos named by drawing number (optional).','photosPath','photosUnc'],dwg:['3','Drawings folder','The folder that holds 1xxx … 8xxx (optional).','dwgPath','dwgUnc']};
function showGuide(){
 const c=S.data?cfg():{};
 const rows=Object.keys(KNAME).map(k=>{const [n,t,d,pk,uk]=KNAME[k];const on=S[KMAP[k]];const path=(c[pk]||'').trim();const unc=(c[uk]||'').trim();
  return '<tr><td style="vertical-align:top"><b>'+n+'. '+t+'</b><div class="muted">'+d+'</div>'+[['Drive',path],['UNC',unc]].filter(x=>x[1]).map(([lb,v])=>'<div style="margin-top:4px"><span class="muted">'+lb+':</span> <code style="word-break:break-all;background:#f3f4f6;padding:2px 6px;border-radius:4px">'+esc(v)+'</code> <button data-gcopy="'+k+'" data-path="'+esc(v)+'" style="padding:1px 8px">Copy</button></div>').join('')+'</td>'+

const PH=new Map();let phActive=0;const phQ=[];
async function findPhotoFile(key){for(const dir of [S.imgDir,S.photoDir]){if(!dir)continue;
  for(const ext of ['jpg','jpeg','png','webp']){try{const fh=await dir.getFileHandle(key+'.'+ext);return await fh.getFile();}catch(e){}}}return null;}
function photoFile(key){if(!PH.has(key))PH.set(key,findPhotoFile(key));return PH.get(key);}
function runPh(){while(phActive<4&&phQ.length){const j=phQ.shift();phActive++;j().finally(()=>{phActive--;runPh();});}}
function thumb(img){const key=img.dataset.key;phQ.push(async()=>{
 const f=await photoFile(key);if(!f){img.parentNode.textContent='No photo';return;}
 try{const bm=await createImageBitmap(f,{resizeWidth:360,resizeQuality:'low'});const c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;c.getContext('2d').drawImage(bm,0,0);
  const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));img.src=URL.createObjectURL(b);bm.close();}
 catch(e){img.src=URL.createObjectURL(f);}});runPh();}
const io=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){io.unobserve(e.target);thumb(e.target);}},{rootMargin:'300px'});
function watchThumbs(root){$$('img[data-key]',root).forEach(i=>io.observe(i));}
async function fullURL(key){const f=await photoFile(key);return f?URL.createObjectURL(f):null;}
const isCad=n=>/\.(dwg|slddrw|sldprt)$/i.test(n);
async function dwgFiles(key){
 if(!S.dwgDir||!key)return [];
 if(!S.dwgIdx){S.dwgIdx=new Map();try{for await(const [n,h] of S.dwgDir.entries())if(h.kind==='directory')S.dwgIdx.set(n.toLowerCase(),{h,files:null});}catch(e){}}
 const d=key[0];let ent=null;for(const [n,v] of S.dwgIdx)if(n.startsWith(d)&&n.endsWith('xxx'))ent=v;
 if(!ent)return [];
 if(!ent.files){ent.files=[];try{for await(const [n,h] of ent.h.entries())if(h.kind==='file'&&/\.(pdf|png|jpe?g|dwg|slddrw|sldprt)$/i.test(n))ent.files.push([n,h,ent.h.name]);}catch(e){}}
 const re=new RegExp('(^|[^0-9])'+key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^0-9]|$)');
 return ent.files.filter(([n])=>re.test(n));}

/* ---------- filtering ---------- */
function flagTest(f,p){switch(f){
 case 'triage':return p['Card Status']==='Triage - Needs Decision';
 case 'needsinfo':return p['Card Status']==='Setup - Needs Info';
 case 'ready':return p['Card Status']==='Setup - Ready to Print';
 case 'notplaced':return p['Card Status']==='Card Printed - Not Placed';
 case 'tagged':return !!p['Delete Tag'];
 case 'nophoto':return p['Has Photo']==='No';
 case 'nothick':return p['Thickness (in)']===undefined||p['Thickness (in)']==='';
 case 'norack':return !p['Rack Location'];
 case 'inqueue':return S.queue.has(p.id);
 default:return true;}}
function visible(){const toks=S.q.toLowerCase().split(/\s+/).filter(Boolean);const f=S.f;
 return S.data.parts.filter(p=>{
  if(f.status&&(p['Card Status']||'')!==f.status)return false;
  if(f.color&&paperFor(p['Thickness (in)'])!==f.color)return false;
  if(f.rack&&p['Rack Location']!==f.rack)return false;
  if(f.route&&!String(p['Process Route']||'').includes(f.route))return false;
  if(f.flag&&!flagTest(f.flag,p))return false;
  if(!f.flag||f.flag!=='tagged'){}
  if(toks.length){const k=S.keys.get(p.id);for(const t of toks)if(!k.includes(t))return false;}
  return true;});}

async function savePhoto(id,key,file){
 const bm=await createImageBitmap(file);const sc=Math.min(1,1600/Math.max(bm.width,bm.height));const c=document.createElement('canvas');c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);
 const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);
 const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.88));
 for(const ext of ['png','jpeg','webp']){try{await S.imgDir.removeEntry(key+'.'+ext);}catch(e){}}
 const fh=await S.imgDir.getFileHandle(key+'.jpg',{create:true});const w=await fh.createWritable();await w.write(b);await w.close();
 PH.delete(key);await patch([id],{'Has Photo':'Yes'},true);}

/* ---------- bulk operations ---------- */
async function patch(ids,fields,silent){
 if(!silent&&!await needUser())return;
 await commit(disk=>{for(const id of ids){const p=disk.parts.find(x=>x.id===id);if(!p)continue;
  for(const k of Object.keys(fields)){if(fields[k]===undefined)delete p[k];else p[k]=fields[k];}
  p._rev=(p._rev||0)+1;p['Last Edited By']=S.user||'';p['Last Edited']=nowStr();}});}
const stPatch=st=>({'Card Status':st,...(st==='Card Printed - Not Placed'?{'Card Printed Date':today()}:{}),...(st==='In Rack'?{'Placed In Rack':today()}:{})});
async function bulk(a){
 const ids=[...S.sel];
 try{
 if(a==='none'){S.sel.clear();}
 else if(a==='all'){S.vis.forEach(p=>S.sel.add(p.id));}
 else if(a==='queueall'){S.vis.forEach(p=>S.queue.add(p.id));saveQueue();toast(S.vis.length+' parts added to the print queue');}
 else if(a==='queue'){ids.forEach(i=>S.queue.add(i));saveQueue();S.sel.clear();toast(ids.length+' added to the print queue');}
 else if(a==='placed'){await patch(ids,stPatch('In Rack'));S.sel.clear();toast('Marked placed');}
 else if(a==='tag'||a==='untag'){await patch(ids,{'Delete Tag':a==='tag'?today()+' - tagged by '+(S.user||'?'):undefined});S.sel.clear();}
 else if(a==='setst'){const r=await modal('Set status for '+ids.length+' parts','<select id="ns" style="width:100%">'+opts(cfg().lists['Card Status'],'')+'</select>',[{t:'Cancel',v:false},{t:'Apply',v:true,pri:true}]);
  if(!r.v)return;await patch(ids,stPatch($('#ns',r.root).value));S.sel.clear();}
 }catch(e){await modal('Error',esc(e.message));}
 renderParts();}

 const rows=[0,1,2].map(i=>'<tr><td style="width:.25in">'+(i+1)+'</td><td>'+esc(route[i]||'')+'</td><td style="width:.8in"></td></tr>').join('');
 const trig=side===2?(p['Red Reorder Point']??p['Reorder Point']??''):(p['Reorder Point']??'');
 const d=new Date();const ds=pad(d.getMonth()+1)+'/'+pad(d.getDate())+'/'+String(d.getFullYear()).slice(2);
 return '<div class="cardp'+(side===2?' red':'')+'"><div class="h"><span>TO: '+esc(p['Rack Location']||'')+'</span><span>'+esc(fmtT(p['Thickness (in)']))+'</span></div>'+
 '<div class="dwg">DWG# '+esc(title(p))+'</div><div class="desc">'+esc(p['Description']||'')+(p['Secondary Description']?'<br><span style="font-size:9pt">'+esc(p['Secondary Description'])+'</span>':'')+'</div>'+
 '<table><tr><th>#</th><th>Operation</th><th>Complete</th></tr>'+rows+'</table>'+
 '<div class="ft"><span>Cosmetic? '+esc(p['Cosmetic']||'None')+'</span></div>'+
 '<div class="trig"><span>Reorder Trigger:</span><span class="tv">'+esc(trig)+'</span></div><div class="trig"><span>Reorder Quantity:</span><span>'+esc(p['Reorder Qty']??'')+'</span></div>'+
 '<div class="ft"><b>CARD: '+side+' of 2</b><span>Date: '+ds+'</span></div>'+
 '<div class="pho">'+(photoURL?'<img src="'+photoURL+'">':'')+'</div>'+
 '<div class="mt">METAL DESCRIP:</div><div style="font-size:9pt">'+esc(p['Material']||'')+'</div>'+
 '<div class="ft"><span>BENN#: '+esc(p['Benn PN']||'')+'</span><span># PER SHEET: '+esc(p['Parts Per Sheet']??'')+'</span></div></div>';}
async function printBundle(color){
 const ps=[...S.queue].map(id=>S.byId.get(id)).filter(p=>p&&paperFor(p['Thickness (in)'])===color);
 ps.sort((a,b)=>String(a['Rack Location']).localeCompare(String(b['Rack Location']))||String(a['Drawing']).localeCompare(String(b['Drawing']),undefined,{numeric:true}));
 if(!ps.length)return;
 const urls={};for(const p of ps){const k=fileKey(p);if(!(k in urls))urls[k]=await fullURL(k);}
 let html='';
 for(let i=0;i<ps.length;i+=4){const ch=ps.slice(i,i+4);
  const slot=(arr,s)=>[0,1,2,3].map(j=>arr[j]?cardHTML(arr[j],s,urls[fileKey(arr[j])]):'<div></div>').join('');
  html+='<div class="sheet">'+slot(ch,1)+'</div>';
  const m=[ch[1],ch[0],ch[3],ch[2]];html+='<div class="sheet">'+slot(m,2)+'</div>';}
 const root=$('#printRoot');root.innerHTML=html;
 await Promise.all($$('img',root).map(i=>i.decode().catch(()=>{})));
 document.body.classList.add('printing');await sleep(150);window.print();document.body.classList.remove('printing');
 const r=await modal('Did the '+color+' bundle print?','<p>Yes marks these '+ps.length+' parts as <b>Card Printed - Not Placed</b>, stamps today\'s date, and removes them from the queue.</p>',[{t:'No, keep in queue',v:false},{t:'Yes, mark printed',v:true,pri:true}]);
 if(r.v){try{await patch(ps.map(p=>p.id),stPatch('Card Printed - Not Placed'));ps.forEach(p=>S.queue.delete(p.id));saveQueue();toast('Marked printed');}catch(e){await modal('Error',esc(e.message));}}
 root.innerHTML='';render();}

async function deleteTagged(){

 const r=await modal('Move '+n+' tagged parts to the archive?','<p>They are removed from the Parts list and kept in the archive, where they can be restored.</p>',[{t:'Cancel',v:false},{t:'Move to archive',v:true,dng:true}]);

 await commit(disk=>{const keep=[],gone=[];for(const p of disk.parts)(p['Delete Tag']?gone:keep).push(p);disk.parts=keep;disk.deleted=(disk.deleted||[]).concat(gone.map(p=>({part:p,on:nowStr(),by:S.user})));});

async function restore(id){
 try{await commit(disk=>{const i=(disk.deleted||[]).findIndex(d=>d.part.id===id);if(i<0)throw new Error('Not in archive');const p=disk.deleted[i].part;

  delete p['Delete Tag'];disk.parts.push(p);disk.deleted.splice(i,1);});toast('Restored');renderAdmin();}

/* ---------- xlsx export (no libraries) ---------- */
const CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CT[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
function zipStore(files){const en=new TextEncoder();const parts=[];const cen=[];let off=0;
 for(const f of files){const nm=en.encode(f.name),d=en.encode(f.data),crc=crc32(d);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);
  parts.push(new Uint8Array(h.buffer),nm,d);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
  cen.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+d.length;}
 let cs=0;cen.forEach(x=>cs+=x.length);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});}
const colL=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;};
const xe=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,'');
function sheetXML(cols,rows){let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetData>';
 const cell=(v,r,c)=>{if(v===undefined||v===null||v==='')return '';const ref=colL(c)+r;return typeof v==='number'?'<c r="'+ref+'"><v>'+v+'</v></c>':'<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xe(v)+'</t></is></c>';};
 x+='<row r="1">'+cols.map((c,i)=>cell(c,1,i)).join('')+'</row>';
 rows.forEach((r,ri)=>{x+='<row r="'+(ri+2)+'">'+cols.map((c,i)=>cell(r[c],ri+2,i)).join('')+'</row>';});
 return x+'</sheetData></worksheet>';}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href);},2000);}
function exportXlsx(){
 const P=S.data.parts;const extra=[...new Set(P.flatMap(p=>Object.keys(p)))].filter(k=>!ALLK.includes(k)&&k!=='id'&&!k.startsWith('_'));
 const cols=[...ALLK,...extra];const dl=(S.data.deleted||[]).map(d=>({...d.part,'Deleted On':d.on,'Deleted By':d.by}));
 const files=[{name:'[Content_Types].xml',data:'<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'},
 {name:'_rels/.rels',data:'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
 {name:'xl/workbook.xml',data:'<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Parts" sheetId="1" r:id="rId1"/><sheet name="Deleted" sheetId="2" r:id="rId2"/></sheets></workbook>'},
 {name:'xl/_rels/workbook.xml.rels',data:'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/></Relationships>'},
 {name:'xl/worksheets/sheet1.xml',data:sheetXML(cols,P)},{name:'xl/worksheets/sheet2.xml',data:sheetXML([...cols,'Deleted On','Deleted By'],dl)}];
 download(zipStore(files),'Kanban_Parts_'+today()+'.xlsx');}
